spring.application.name=order-service
server.port=8081

# ============================================================
# MySQL — dùng chung container với inventory-service
# ============================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/order_service
spring.datasource.username=root
spring.datasource.password=mysql

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ============================================================
# Inventory Service URL (externalized — 12-factor app pattern)
# Override bằng env var: INVENTORY_URL=http://other-host:8082
# ============================================================
inventory.url=http://localhost:8082

# Feign DEBUG log (bỏ comment khi cần trace request/response)
# logging.level.com.fudn.orderservice.client.InventoryClient=DEBUG
